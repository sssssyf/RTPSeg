# Config format schema number
format_version: 1

###################
## Model options
baseline_only: False
infra_only: False
image_only: False
image_and_infra: True

checkpoint: #./model/RTPSegNet_best.ckpt
  #None default


model_params:
  model_architecture: "RTPSegNet"
  input_dims: 4
  voxel_size: 0.05
  cr: 1  # enlarge factor of layer_num
  layer_num:
    - 32
    - 32
    - 64
    - 128
    - 256
    - 256
    - 128
    - 96
    - 96


  hiden_size_list:
    - 256
    - 128
    - 96

  spatial_shape:
    - 1000
    - 1000
    - 60
  scale_list:
    - 2
    - 4
    - 8
    - 16

  hiden_size: 64

  num_class: 18

  backbone_2d: resnet34
  pretrained2d: True
  pretrained_load_path: ./model/resnet34-b627a593.pth


###################
## Dataset options
dataset_params:
  training_size: 19132
  dataset_type: "RTPSeg_dataset"
  pc_dataset_type: "RTPSeg"
  collate_type: "collate_fn_voxel_2D"
  ignore_label: -1

  label_mapping: "./config/label_mapping/RTPSeg.yaml"
  learning_map: False



  img_json_path: "./json/answer_camera.json"
  infra_json_path: "./json/answer_infra.json"

  img_json_path_2: "./json/answer_camera_02.json"
  infra_json_path_2: "./json/answer_infra_02.json"
  img_resized:
   - 1920
   - 1072


  # 2D augmentation
  bottom_crop:
    - 480
    - 320
  color_jitter:
    - 0.4
    - 0.4
    - 0.4
  flip2d: 0.5
  image_normalizer:
    - [0.485, 0.456, 0.406]
    - [0.229, 0.224, 0.225]
  max_volume_space:
    - 50
    - 50
    - 10
  min_volume_space:
    - -50
    - -50
    - -4

  train_data_loader:
    data_path: "/data/syf/dataset/RTPSeg"
    batch_size: 2
    shuffle: True
    num_workers: 16
    rotate_aug: True
    flip_aug: True
    scale_aug: True
    transform_aug: True
    dropout_aug: True

  val_data_loader:
    data_path: "/data/syf/dataset/RTPSeg"
    shuffle: False
    num_workers: 8

    # normal test
    batch_size: 8
    rotate_aug: False
    flip_aug: False
    scale_aug: False
    transform_aug: False
    dropout_aug: False


###################
## Train params
train_params:
  max_num_epochs: 200

  learning_rate: 0.024
  optimizer: SGD  # [SGD, Adam]
  lr_scheduler: CosineAnnealingWarmRestarts  # [StepLR, ReduceLROnPlateau, CosineAnnealingLR, CosineAnnealingWarmRestarts]
  momentum: 0.9
  nesterov: True
  weight_decay: 1.0e-4

  lambda_seg2d: 1
  lambda_xm: 0.05
